name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
      - run: bun run ${{ matrix.task }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            .next
            !.next/cache
          # `.next` is a dot-directory and the action skips hidden files by default,
          # which uploads an empty artifact and only warns — hence the hard error too.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bunx playwright install --with-deps chromium
      - run: bun run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # Mints real users, so it runs against a Neon branch made for this run and deleted after. Skipped
  # until the repo has the NEON_PROJECT_ID variable and NEON_API_KEY secret.
  e2e-signed-in:
    needs: build
    if: vars.NEON_PROJECT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bunx playwright install --with-deps chromium
      # Neon deletes the branch itself if the cleanup step never runs.
      - id: expiry
        run: echo "at=$(date -u -d '+2 hours' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          parent_branch: dev
          branch_name: ci-${{ github.run_id }}-${{ github.run_attempt }}
          expires_at: ${{ steps.expiry.outputs.at }}
      - run: bun run db:migrate
        env:
          DATABASE_URL_UNPOOLED: ${{ steps.neon.outputs.db_url }}
      - name: Generate auth secret
        run: |
          secret=$(openssl rand -base64 32)
          echo "::add-mask::$secret"
          echo "BETTER_AUTH_SECRET=$secret" >> "$GITHUB_ENV"
      - run: bun run e2e:signed-in
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
          BETTER_AUTH_URL: http://127.0.0.1:3210
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-signed-in
          path: playwright-report
          retention-days: 7
      - uses: neondatabase/delete-branch-action@v3
        if: always() && steps.neon.outputs.branch_id
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: ${{ steps.neon.outputs.branch_id }}
